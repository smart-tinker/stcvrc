name: Required downstream capability
description: A required scenario not yet satisfied by stock CVR
title: "[Compatibility] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: Required scenario and upstream gap
      description: State the required behavior, stock CVR/core versions and evidence of the missing capability. No standalone product roadmap.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed and expected behavior
      description: Include reproducible steps, exact source revisions and sanitized evidence. Separate facts from hypotheses and untested claims.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, non-goals and existing work
      description: Link related issues/PRs after checking https://github.com/smart-tinker/stcvrc/issues and /pulls. Identify the smallest downstream delta and dependencies.
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: For each criterion give verification method and expected observable result; include applicable negative cases. Separate source/build checks from native acceptance.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Upstream exit and stop conditions
      description: What upstream capability/evidence lets this patch be removed and users migrate to stock CVR? When should implementation stop for clarification?
    validations:
      required: true
