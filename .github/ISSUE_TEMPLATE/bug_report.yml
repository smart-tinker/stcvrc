name: Bug report
description: Report a reproducible STCVRC issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report behavior specific to STCVRC. Do not include credentials, server addresses, private keys, certificates, tokens, or unredacted profiles/logs.
  - type: checkboxes
    id: ensure
    attributes:
      label: Before submitting
      options:
        - label: I searched the [STCVRC issue tracker](https://github.com/smart-tinker/stcvrc/issues) for a related report.
          required: true
        - label: I removed credentials and other private operational data from all evidence.
          required: true
  - type: input
    id: version
    attributes:
      label: STCVRC version
      description: Include the release tag or candidate identifier shown by the app/core.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source commit
      description: Exact 40-character source commit, if available; otherwise enter unknown.
    validations:
      required: true
  - type: input
    id: binary
    attributes:
      label: Binary SHA-256
      description: Digest of the core binary used, if available; otherwise enter unknown.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - Other
  - type: input
    id: scenario
    attributes:
      label: Application or scenario
      description: Name the app/action and when the issue occurs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest repeatable steps and whether the result is from a CI run or a user installation.
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Redacted profile/config
      description: Optional minimal relevant excerpt only. Remove endpoints, credentials, keys, certificates, tokens, and private paths.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional relevant lines only. Review and redact them before posting; do not enable DEBUG solely to create a report.
      render: shell
  - type: textarea
    id: impact
    attributes:
      label: Impact and untested cases
