name: STCVRC network lab

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - tools/network-lab/**
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/**
      - tools/network-lab/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-lab:
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Read the exact fixture commit without credentials
        env:
          FIXTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$GITHUB_WORKSPACE/fixture"
          git -C "$GITHUB_WORKSPACE/fixture" fetch --quiet --depth=1 \
            https://github.com/smart-tinker/stcvrc.git "$FIXTURE_SHA"
          git -C "$GITHUB_WORKSPACE/fixture" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/fixture" rev-parse HEAD)" = "$FIXTURE_SHA"
          printf 'Fixture commit: %s\n' "$FIXTURE_SHA"

      - name: Verify inputs, build the pinned candidate and test loopback failover
        run: bash "$GITHUB_WORKSPACE/fixture/tools/network-lab/ci.sh"

  windows-exe-lab:
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft))
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read the exact fixture commit without credentials
        env:
          FIXTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:FIXTURE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid fixture SHA' }
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'fixture'
          git init --quiet $fixture
          git -C $fixture fetch --quiet --depth=1 https://github.com/smart-tinker/stcvrc.git $env:FIXTURE_SHA
          git -C $fixture checkout --quiet --detach FETCH_HEAD
          if ((git -C $fixture rev-parse HEAD) -cne $env:FIXTURE_SHA) { throw 'Fixture SHA mismatch' }
          Write-Output "Fixture commit: $env:FIXTURE_SHA"
      - name: Build and test the exact MIT-LZO candidate from fresh source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH += ';C:\Program Files\Git\usr\bin'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'fixture/tools/network-lab')
          python -m unittest discover -v -p 'test_*.py'
          $sourceSha = '92107a2605e19df0cb0d8b7bb08aa9ffb6b7ee93'
          $expectedGoSha = '7ecd2d7260e82c59bcbd7f1077a07cee2dea607295b858df67195a1e4e09629b'
          $expectedCoreSha = 'c00707e061c91fd5bfa5b3a88653597b00ae1ffad39ba33221e5c8cad1eefcbf'
          $temp = Join-Path $env:RUNNER_TEMP 'stcvrc-network-lab'
          $goZip = Join-Path $temp 'go1.26.10.windows-amd64.zip'
          $goRoot = Join-Path $temp 'toolchain'
          $source = Join-Path $temp 'source'
          $core = Join-Path $temp 'stcvrc-candidate.exe'
          New-Item -ItemType Directory -Force -Path $temp,$goRoot | Out-Null
          try {
            & curl.exe --fail --location --proto '=https' --retry 2 --max-time 180 --silent --show-error 'https://go.dev/dl/go1.26.10.windows-amd64.zip' -o $goZip
            if ($LASTEXITCODE -ne 0) { throw 'Go toolchain download failed' }
            $goHash = (Get-FileHash -Path $goZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($goHash -cne $expectedGoSha) { throw 'Go toolchain SHA256 mismatch' }
            Expand-Archive -Path $goZip -DestinationPath $goRoot -Force
            $go = Join-Path $goRoot 'go\bin\go.exe'
            if (-not (Test-Path -LiteralPath $go)) { throw 'Pinned Go executable missing' }
            git init --quiet $source
            git -C $source remote add origin https://github.com/smart-tinker/stcvrc.git
            git -C $source fetch --quiet --depth=1 --no-tags origin $sourceSha
            if ($LASTEXITCODE -ne 0) { throw 'Candidate source fetch failed' }
            git -C $source checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Candidate source checkout failed' }
            $actualSource = (git -C $source rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualSource -cne $sourceSha) { throw 'Candidate source SHA mismatch' }
            $env:GOTOOLCHAIN = 'local'
            $env:GOWORK = 'off'
            $env:GOTELEMETRY = 'off'
            $env:GOOS = 'windows'
            $env:GOARCH = 'amd64'
            $env:GOAMD64 = 'v1'
            $env:CGO_ENABLED = '0'
            $env:GOMAXPROCS = '2'
            $env:GOFLAGS = '-mod=readonly -p=2'
            $env:GOPATH = Join-Path $temp 'gopath'
            $env:GOMODCACHE = Join-Path $temp 'modcache'
            $env:GOCACHE = Join-Path $temp 'gocache'
            New-Item -ItemType Directory -Force -Path $env:GOPATH,$env:GOMODCACHE,$env:GOCACHE | Out-Null
            $version = '1.19.33-STCVRC-candidate-mit-lzo-20261109'
            $buildTime = '2026-11-09T00:00:00Z'
            $ldflags = "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$buildTime"
            & $go version
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Go did not start' }
            Set-Location $source
            & $go build -tags=with_gvisor -trimpath -buildvcs=false -ldflags $ldflags -o $core .
            if ($LASTEXITCODE -ne 0) { throw 'Fresh Windows candidate build failed' }
            $actualCoreSha = (Get-FileHash -Path $core -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualCoreSha -cne $expectedCoreSha) { throw 'Fresh Windows candidate SHA256 mismatch' }
            $dirty = (git -C $source status --porcelain)
            if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Candidate source tree changed during build' }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Fresh source-built Windows/amd64 core: source $actualSource, Go 1.26.10, SHA256 $actualCoreSha."
            Set-Location (Join-Path $env:GITHUB_WORKSPACE 'fixture/tools/network-lab')
            python windows.py --core $core --core-sha256 $expectedCoreSha
            if ($LASTEXITCODE -ne 0) { throw 'Fresh-source Windows network lab failed' }
          }
          finally {
            Set-Location $env:GITHUB_WORKSPACE
            Remove-Item -LiteralPath $temp -Force -Recurse -ErrorAction SilentlyContinue
          }
