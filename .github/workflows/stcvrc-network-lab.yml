name: STCVRC network lab

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - tools/network-lab/**
      - tools/linux-maintenance/**
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-lab:
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Read the exact fixture commit without credentials
        env:
          FIXTURE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FIXTURE_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: |
          set -euo pipefail
          [[ "$FIXTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$GITHUB_WORKSPACE/fixture"
          git -C "$GITHUB_WORKSPACE/fixture" fetch --quiet --depth=1 \
            https://github.com/smart-tinker/stcvrc.git "$FIXTURE_REF"
          git -C "$GITHUB_WORKSPACE/fixture" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/fixture" rev-parse HEAD)" = "$FIXTURE_SHA"
          printf 'Fixture commit: %s\n' "$FIXTURE_SHA"

      - name: Verify inputs, build the pinned candidate and test loopback failover
        run: bash "$GITHUB_WORKSPACE/fixture/tools/network-lab/ci.sh"

      - name: Run isolated Linux maintenance transaction and recovery
        run: |
          set -euo pipefail
          fixture_root="$GITHUB_WORKSPACE/fixture"
          fixture_sha="$(git -C "$fixture_root" rev-parse HEAD)"
          [[ "$fixture_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'Exact maintenance source: %s\n' "$fixture_sha" >> "$GITHUB_STEP_SUMMARY"
          bash "$fixture_root/tools/linux-maintenance/ci.sh" \
            "$fixture_root" "$RUNNER_TEMP/stcvrc-ci-linux-maintenance"

