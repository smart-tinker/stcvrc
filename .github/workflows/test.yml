name: STCVRC source checks

"on":
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - component/ca/ca-certificates.crt
      - .github/workflows/**
      - tools/network-lab/**
      - tools/license-audit/**
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - component/ca/ca-certificates.crt
      - .github/workflows/**
      - tools/network-lab/**
      - tools/license-audit/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - name: Read the source revision being checked
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" fetch --quiet --depth=1 \
            https://github.com/smart-tinker/stcvrc.git "$SOURCE_SHA"
          git -C "$GITHUB_WORKSPACE/source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Source commit: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-pinned Go and workflow linter
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ci-tools"
          cd "$RUNNER_TEMP/ci-tools"
          curl --fail --location --proto '=https' --retry 2 --max-time 120 --silent --show-error \
            https://go.dev/dl/go1.26.10.linux-amd64.tar.gz -o go.tar.gz
          printf '%s  go.tar.gz\n' ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5 | sha256sum --check --status
          tar -xzf go.tar.gz
          curl --fail --location --proto '=https' --retry 2 --max-time 120 --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o actionlint.tar.gz
          printf '%s  actionlint.tar.gz\n' 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 | sha256sum --check --status
          tar -xzf actionlint.tar.gz actionlint
          printf '%s\n' "$RUNNER_TEMP/ci-tools/go/bin" "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Validate workflows and fixture contracts
        working-directory: source
        run: |
          set -euo pipefail
          actionlint -color
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/network-lab -p 'test_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/license-audit -p 'test_*.py' -v

      - name: Test current source and compile Linux and Windows cores
        working-directory: source
        run: |
          set -euo pipefail
          export GOPATH="$RUNNER_TEMP/go-path" GOCACHE="$RUNNER_TEMP/go-build"
          go version
          timeout 420s go test -p=2 -mod=readonly -count=1 -timeout=120s \
            ./transport/openvpn ./adapter/outbound ./config ./listener/http
          timeout 300s go build -p=2 -mod=readonly -tags=with_gvisor -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/core-linux" .
          GOOS=windows GOARCH=amd64 timeout 300s go build -p=2 -mod=readonly -tags=with_gvisor -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/core-windows.exe" .
          timeout 90s go mod verify
          test -z "$(git status --porcelain)"
          printf '\nCurrent-source tests and Linux/Windows compilation passed. These are CI builds, not release artifacts.\n' >> "$GITHUB_STEP_SUMMARY"

  license-audit:
    needs: source
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUDIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch audit manifest at tested revision
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/audit-definition"
          git init --quiet "$audit_root"
          git -C "$audit_root" remote add origin https://github.com/smart-tinker/stcvrc.git
          git -C "$audit_root" fetch --quiet --depth=1 --no-tags origin "$AUDIT_COMMIT"
          git -C "$audit_root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$audit_root" rev-parse HEAD)" = "$AUDIT_COMMIT"
          printf 'Audit manifest commit: %s\n' "$AUDIT_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch exact source and upstream revisions
        run: |
          set -euo pipefail
          fetch_tag() {
            local dir="$1" repo_url="$2" tag="$3" expected="$4"
            mkdir -p "$dir"
            git -C "$dir" init --quiet
            git -C "$dir" remote add origin "$repo_url"
            git -C "$dir" fetch --quiet --depth=1 --no-tags origin "refs/tags/$tag"
            local actual
            actual="$(git -C "$dir" rev-parse 'FETCH_HEAD^{commit}')"
            test "$actual" = "$expected"
            git -C "$dir" checkout --quiet --detach "$actual"
            test "$(git -C "$dir" rev-parse HEAD)" = "$expected"
          }

          stable="$RUNNER_TEMP/source-1.19.29"
          candidate="$RUNNER_TEMP/source-1.19.33"
          fetch_tag "$stable" https://github.com/smart-tinker/stcvrc.git v1.19.29-stcvrc.1 7b93ba0e1439e7f27629743bed550d99e7f9c9a4
          fetch_tag "$candidate" https://github.com/smart-tinker/stcvrc.git stcvrc-1.19.33-rc.2 d888dfad5e785217778bb7515c931840d5307dd4

          git -C "$stable" fetch --quiet --depth=1 origin 9e23508270fed96e346fd4f68447e90401669131
          git -C "$stable" fetch --quiet --depth=1 https://github.com/MetaCubeX/mihomo.git refs/tags/v1.19.29
          stable_upstream="$(git -C "$stable" rev-parse 'FETCH_HEAD^{commit}')"
          test "$stable_upstream" = e26714a181ac0e2fa803453c0a8e9a9ce94e31cb
          test -z "$(git -C "$stable" diff --name-only 9e23508270fed96e346fd4f68447e90401669131 HEAD -- . ':(exclude)README.md' ':(exclude)build-windows.ps1')"

          git -C "$candidate" fetch --quiet --depth=1 https://github.com/MetaCubeX/mihomo.git refs/tags/v1.19.33
          candidate_upstream="$(git -C "$candidate" rev-parse 'FETCH_HEAD^{commit}')"
          test "$candidate_upstream" = 3f27ef39f8c96bbfbc8b0b9bb10f5c9ef60149d8
          git -C "$candidate" fetch --quiet --depth=1 origin 9ccecd85017ec196975239a3afeef886cf991588
          patch_claim_subject="$(git -C "$candidate" show -s --format=%s 9ccecd85017ec196975239a3afeef886cf991588)"

          python3 "$RUNNER_TEMP/audit-definition" "$stable" "$candidate" "$stable_upstream" "$candidate_upstream" "$patch_claim_subject" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path

          audit_root, stable, candidate, stable_upstream, candidate_upstream, patch_subject = sys.argv[1:]
          root = Path(audit_root)
          manifest = json.loads((root / "docs/license-provenance.json").read_text(encoding="utf-8"))
          variants = {item["id"]: item for item in manifest["variants"]}

          def changed(repo, base, head):
              return set(subprocess.check_output(
                  ["git", "-C", repo, "diff", "--name-only", base, head], text=True
              ).splitlines())

          stable_expected = set(variants["accepted-1.19.29"]["downstream_delta_files"])
          stable_actual = changed(stable, stable_upstream, "9e23508270fed96e346fd4f68447e90401669131")
          stable_actual.discard("README.md")
          assert stable_actual == stable_expected, f"stable source delta mismatch: {stable_actual ^ stable_expected}"

          source_path = Path(candidate) / "candidates/v1.19.33-20261022/source.json"
          source = json.loads(source_path.read_text(encoding="utf-8"))
          assert source["upstream"]["commit"] == candidate_upstream
          candidate_actual = changed(candidate, candidate_upstream, "d888dfad5e785217778bb7515c931840d5307dd4")
          candidate_actual -= {
              "README.md", "build-windows.ps1",
              "candidates/v1.19.33-20261022/README.md",
              "candidates/v1.19.33-20261022/source.json",
          }
          candidate_expected = set(source["patchFiles"])
          assert candidate_actual == candidate_expected, f"candidate source delta mismatch: {candidate_actual ^ candidate_expected}"
          assert len(candidate_expected) == 14
          for relative, expected in source["patchFiles"].items():
              actual = hashlib.sha256((Path(candidate) / relative).read_bytes()).hexdigest()
              assert actual == expected, f"candidate source digest mismatch: {relative}"

          claimed_base = source["patchSource"]["base"]
          if claimed_base != candidate_upstream:
              print("PROVENANCE WARNING: source.json patchSource.base does not match the v1.19.33 upstream commit.")
              print(f"source.json names patchSource.commit={source['patchSource']['commit']} base={claimed_base}")
              print(f"That public commit subject is: {patch_subject}")
              print("The 14 .33 source file hashes and exact upstream diff are checked independently; the patch-origin linkage remains unverified.")
          PY

          {
            printf '## Exact upstream-to-STCVRC source deltas\n\n'
            printf '### Accepted 1.19.29 code delta\n\n'
            git -C "$stable" diff --no-ext-diff --no-renames --name-status "$stable_upstream" 9e23508270fed96e346fd4f68447e90401669131
            printf '\n### Candidate 1.19.33 code delta\n\n'
            git -C "$candidate" diff --no-ext-diff --no-renames --name-status "$candidate_upstream" d888dfad5e785217778bb7515c931840d5307dd4
            printf '\nCandidate patch-origin claim subject: %s\n' "$patch_claim_subject"
            printf 'Candidate patch-origin base recorded in source.json: %s\n' "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["patchSource"]["base"])' "$candidate/candidates/v1.19.33-20261022/source.json")"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fresh builds and license inventories for both source lines
        run: |
          set -euo pipefail
          temp="$RUNNER_TEMP/issue7-license-audit"
          mkdir -p "$temp"
          trap 'rm -rf "$temp" "$RUNNER_TEMP/source-1.19.29" "$RUNNER_TEMP/source-1.19.33" "$RUNNER_TEMP/toolchain-go1.26.5" "$RUNNER_TEMP/toolchain-go1.26.10" "$RUNNER_TEMP/audit-definition"' EXIT

          install_go() {
            local version="$1" digest="$2" dir="$RUNNER_TEMP/toolchain-go$1"
            mkdir -p "$dir"
            curl --fail --location --proto '=https' --retry 2 --max-time 180 --silent --show-error \
              "https://go.dev/dl/go$version.linux-amd64.tar.gz" -o "$dir/go.tar.gz"
            printf '%s  %s\n' "$digest" "$dir/go.tar.gz" | sha256sum --check --status
            tar -xzf "$dir/go.tar.gz" -C "$dir"
            rm "$dir/go.tar.gz"
            printf '%s\n' "$dir/go"
          }

          go125="$(install_go 1.26.5 5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053)"
          go12610="$(install_go 1.26.10 ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5)"
          mismatches=0

          audit_variant() {
            local id="$1" go="$2" expected_sha="$3" version="$4" build_time="$5" source_dir="$6"
            local gopath="$temp/$id/gopath" modcache="$temp/$id/modcache" gocache="$temp/$id/gocache"
            local gobin="$temp/$id/bin" licenses="$temp/$id/licenses" binary="$temp/$id/verge-mihomo.exe"
            mkdir -p "$gopath" "$modcache" "$gocache" "$gobin"
            export GOTOOLCHAIN=local GOENV=off GOWORK=off GOTELEMETRY=off
            export CGO_ENABLED=0 GOAMD64=v1 GOPATH="$gopath" GOMODCACHE="$modcache" GOCACHE="$gocache" GOBIN="$gobin"
            go_bin="$(dirname "$go")"
            export PATH="$go_bin:$gobin:$PATH"
            export GOFLAGS=-mod=readonly
            unset GOOS GOARCH GOMAXPROCS

            {
              printf '\n## %s fresh source build and license inventory\n\n' "$id"
              printf 'Source commit: %s\n\n' "$(git -C "$source_dir" rev-parse HEAD)"
              printf 'Go toolchain: %s\n\n' "$("$go" version)"
            } | tee -a "$GITHUB_STEP_SUMMARY"

            cd "$source_dir"
            if [[ "$id" == accepted-1.19.29 ]]; then
              "$go" test -p=2 -tags=with_gvisor -count=1 -timeout=120s ./transport/openvpn ./adapter/outbound
            else
              export GOMAXPROCS=2
              "$go" test -p=2 -tags=with_gvisor -count=1 -timeout=180s ./transport/openvpn ./adapter/outbound ./adapter/outboundgroup
            fi

            ldflags="-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$build_time"
            if [[ "$id" == accepted-1.19.29 ]]; then
              GOOS=windows GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 GOFLAGS=-mod=readonly \
                "$go" build -tags=with_gvisor -trimpath -buildvcs=false -ldflags "$ldflags" -o "$binary" .
            else
              GOOS=windows GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 GOMAXPROCS=2 GOFLAGS='-mod=readonly -p=2' \
                "$go" build -tags=with_gvisor -trimpath -buildvcs=false -ldflags "$ldflags" -o "$binary" .
            fi

            local actual_sha
            actual_sha="$(sha256sum "$binary" | awk '{print $1}')"
            {
              printf '\nFreshly built binary SHA256: %s\n' "$actual_sha"
              printf 'Published asset reference SHA256: %s\n\n' "$expected_sha"
              printf '### go version -m\n\n'
              GOOS=windows GOARCH=amd64 GOAMD64=v1 "$go" version -m "$binary"
              printf '\n### Module requirements from go.mod\n\n'
              cat go.mod
              printf '\n### Resolved module graph, including replacements\n\n'
              "$go" list -m all
              printf '\n### Package license report for windows/amd64 with_gvisor\n\n'
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 GOFLAGS=-mod=readonly \
                "$go" install github.com/google/go-licenses/v2@v2.0.1
              GOOS=windows GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 GOFLAGS='-mod=readonly -tags=with_gvisor' \
                "$gobin/go-licenses" report .
              printf '\n### Repository-embedded license text file digests\n\n'
              find . -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'COPYRIGHT*' \) \
                -not -path './.git/*' -print0 | sort -z | xargs -0 -r sha256sum
              printf '\n### Go toolchain license text digest\n\n'
              sha256sum "$(dirname "$go")/../LICENSE"
              printf '\n### Source go:embed directives\n\n'
              python3 - "$source_dir" <<'PYEMBED'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for path in sorted(root.rglob("*.go")):
              if ".git" in path.parts:
                  continue
              for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  if "go:embed" in line:
                      print(f"{path.relative_to(root)}:{number}:{line.strip()}")
          PYEMBED
            } | tee -a "$GITHUB_STEP_SUMMARY"

            GOOS=windows GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 GOFLAGS='-mod=readonly -tags=with_gvisor' \
              "$gobin/go-licenses" save . --save_path="$licenses"
            {
              printf '\n### Collected dependency license/notice file digests\n\n'
              find "$licenses" -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' -o -iname 'COPYRIGHT*' \) \
                -print0 | sort -z | xargs -0 -r sha256sum
            } | tee -a "$GITHUB_STEP_SUMMARY"

            "$go" mod verify
            test -z "$(git -C "$source_dir" status --porcelain)"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              printf 'Reproduced SHA mismatch for %s.\n' "$id" | tee -a "$GITHUB_STEP_SUMMARY"
              mismatches=1
            fi
          }

          audit_variant accepted-1.19.29 "$go125" \
            71195c943be67017c5646ea2021734bc122fa83c58a408ab6713a2b25cb6b62b \
            1.19.29-STCVRC-openvpn-rekey-9e235082 2026-07-20T00:00:00Z "$RUNNER_TEMP/source-1.19.29"
          audit_variant candidate-1.19.33-rc.2 "$go12610" \
            6a35ab8e2db4c0171f74563aded55949d10a3dcc5ad9c1c1b5e155ab2a2986c7 \
            1.19.33-STCVRC-candidate-20261022 2026-10-22T00:00:00Z "$RUNNER_TEMP/source-1.19.33"
          test "$mismatches" -eq 0
          printf '\nBoth published reference digests matched fresh-source builds. This inventory is evidence for review, not an automated legal-compliance decision.\n' >> "$GITHUB_STEP_SUMMARY"
