name: STCVRC source checks

"on":
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - component/ca/ca-certificates.crt
      - .github/workflows/**
      - tools/network-lab/**
      - candidates/cvr-2.5.10/**
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - component/ca/ca-certificates.crt
      - .github/workflows/**
      - tools/network-lab/**
      - candidates/cvr-2.5.10/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - name: Read the source revision being checked
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" fetch --quiet --depth=1 \
            https://github.com/smart-tinker/stcvrc.git "$SOURCE_SHA"
          git -C "$GITHUB_WORKSPACE/source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'Source commit: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-pinned Go and workflow linter
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/ci-tools"
          cd "$RUNNER_TEMP/ci-tools"
          curl --fail --location --proto '=https' --retry 2 --max-time 120 --silent --show-error \
            https://go.dev/dl/go1.26.10.linux-amd64.tar.gz -o go.tar.gz
          printf '%s  go.tar.gz\n' ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5 | sha256sum --check --status
          tar -xzf go.tar.gz
          curl --fail --location --proto '=https' --retry 2 --max-time 120 --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o actionlint.tar.gz
          printf '%s  actionlint.tar.gz\n' 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 | sha256sum --check --status
          tar -xzf actionlint.tar.gz actionlint
          printf '%s\n' "$RUNNER_TEMP/ci-tools/go/bin" "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Validate workflows and fixture contracts
        working-directory: source
        run: |
          set -euo pipefail
          actionlint -color
          python3 -m unittest discover -s tools/network-lab -p 'test_*.py' -v

      - name: Test current source and compile Linux and Windows cores
        working-directory: source
        run: |
          set -euo pipefail
          export GOPATH="$RUNNER_TEMP/go-path" GOCACHE="$RUNNER_TEMP/go-build"
          go version
          timeout 420s go test -p=2 -mod=readonly -count=1 -timeout=120s \
            ./transport/openvpn ./adapter/outbound ./config ./listener/http
          timeout 300s go build -p=2 -mod=readonly -tags=with_gvisor -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/core-linux" .
          GOOS=windows GOARCH=amd64 timeout 300s go build -p=2 -mod=readonly -tags=with_gvisor -trimpath -buildvcs=false \
            -o "$RUNNER_TEMP/core-windows.exe" .
          timeout 90s go mod verify
          test -z "$(git status --porcelain)"
          printf '\nCurrent-source tests and Linux/Windows compilation passed. These are CI builds, not release artifacts.\n' >> "$GITHUB_STEP_SUMMARY"

  cvr-2-5-10-package:
    if: >-
      github.repository == 'smart-tinker/stcvrc' &&
      !github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the exact pull request source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr_source="$RUNNER_TEMP/pr-source"
          git init --quiet "$pr_source"
          git -C "$pr_source" remote add origin https://github.com/smart-tinker/stcvrc.git
          git -C "$pr_source" fetch --quiet --depth=1 --no-tags origin "$SOURCE_SHA"
          git -C "$pr_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$pr_source" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "PR source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "PR_SOURCE=$pr_source" >> "$GITHUB_ENV"

      - name: Install pinned workflow linter and Python crypto dependency
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/ci-tools"
          mkdir -p "$tool"
          curl --fail --location --proto '=https' --retry 2 --max-time 120 --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$tool/actionlint.tar.gz"
          printf '%s  %s\n' 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 "$tool/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$tool/actionlint.tar.gz" -C "$tool" actionlint
          echo "$tool" >> "$GITHUB_PATH"
          python3 -c 'import cryptography'

      - name: Validate workflows and verifier fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          actionlint -color "$PR_SOURCE/.github/workflows/test.yml"
          python3 -B -m unittest discover -s "$PR_SOURCE/candidates/cvr-2.5.10" -p 'test_*.py' -v

      - name: Download only pinned public CVR inputs
        run: |
          set -euo pipefail
          manifest="$PR_SOURCE/candidates/cvr-2.5.10/inputs.json"
          downloads="$RUNNER_TEMP/cvr-downloads.tsv"
          input_dir="$RUNNER_TEMP/cvr-public-inputs"
          mkdir -p "$input_dir"
          python3 - "$manifest" "$downloads" <<'PY'
          import json
          from pathlib import Path
          import sys
          from urllib.parse import urlparse

          manifest_path, output_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          repo = "clash-verge-rev/clash-verge-rev"
          if manifest.get("repository") != repo:
              raise SystemExit("unexpected upstream repository")
          rows = []

          def add(filename, url, host, path):
              if not isinstance(filename, str) or Path(filename).name != filename or filename in ("", ".", ".."):
                  raise SystemExit("unsafe pinned input filename")
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != host or parsed.path != path or parsed.query or parsed.fragment:
                  raise SystemExit("refusing non-pinned public input URL")
              rows.append((filename, url))

          for release in manifest["releases"]:
              tag = release["tag"]
              add(release["metadataFile"],
                  f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
                  "api.github.com", f"/repos/{repo}/releases/tags/{tag}")
              commit = release["sourceCommit"]
              config = release["config"]
              add(config["file"], config["sourceURL"], "raw.githubusercontent.com",
                  f"/{repo}/{commit}/src-tauri/tauri.conf.json")
              for asset in release["assets"].values():
                  add(asset["file"], asset["url"], "github.com",
                      f"/{repo}/releases/download/{tag}/{asset['name']}")
          output_path.write_text("".join(f"{name}\t{url}\n" for name, url in rows), encoding="utf-8")
          PY
          while IFS=$'\t' read -r name url; do
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 \
              --max-time 300 --max-filesize 67108864 --silent --show-error \
              "$url" -o "$input_dir/$name"
          done < "$downloads"

      - name: Build fresh MIT-LZO source and verify the official installer pair
        run: |
          set -euo pipefail
          source_sha=76b7ec3ff9854d32cb3964403c065928ecdc9dd6
          upstream_sha=3f27ef39f8c96bbfbc8b0b9bb10f5c9ef60149d8
          core_source="$RUNNER_TEMP/cvr-mit-lzo-source"
          go_dir="$RUNNER_TEMP/toolchain-go1.26.10"
          mkdir -p "$core_source" "$go_dir"
          git -C "$core_source" init --quiet
          git -C "$core_source" remote add origin https://github.com/smart-tinker/stcvrc.git
          git -C "$core_source" fetch --quiet --depth=1 --no-tags origin "$source_sha"
          git -C "$core_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$core_source" rev-parse HEAD)" = "$source_sha"
          git -C "$core_source" fetch --quiet --depth=1 --no-tags https://github.com/MetaCubeX/mihomo.git refs/tags/v1.19.33
          test "$(git -C "$core_source" rev-parse 'FETCH_HEAD^{commit}')" = "$upstream_sha"

          curl --fail --location --proto '=https' --retry 2 --max-time 180 --silent --show-error \
            https://go.dev/dl/go1.26.10.linux-amd64.tar.gz -o "$go_dir/go.tar.gz"
          printf '%s  %s\n' ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5 "$go_dir/go.tar.gz" | sha256sum --check --status
          tar -xzf "$go_dir/go.tar.gz" -C "$go_dir"
          export PATH="$go_dir/go/bin:$PATH"
          export GOENV=off GOTOOLCHAIN=local GOWORK=off GOTELEMETRY=off
          export CGO_ENABLED=0 GOAMD64=v1 GOMAXPROCS=2
          export GOPATH="$RUNNER_TEMP/cvr-gopath" GOMODCACHE="$RUNNER_TEMP/cvr-modcache" GOCACHE="$RUNNER_TEMP/cvr-gocache"
          export GOFLAGS='-mod=readonly -p=2'
          mkdir -p "$GOPATH" "$GOMODCACHE" "$GOCACHE"
          test "$(go version | awk '{print $3}')" = "go1.26.10"
          cd "$core_source"
          go list -m all > "$RUNNER_TEMP/cvr-modules.txt"
          grep -Fxq 'github.com/anchore/go-lzo v0.1.1' "$RUNNER_TEMP/cvr-modules.txt"
          if grep -q '^github.com/rasky/go-lzo ' "$RUNNER_TEMP/cvr-modules.txt"; then
            printf 'GPL-only go-lzo module remains in the candidate module graph.\n' >&2
            exit 1
          fi
          go test -tags=with_gvisor -count=1 -timeout=180s ./transport/openvpn ./adapter/outbound ./adapter/outboundgroup
          go mod verify

          version=1.19.33-STCVRC-candidate-mit-lzo-20261109
          build_time=2026-11-09T00:00:00Z
          ldflags="-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$build_time"
          binary="$RUNNER_TEMP/verge-mihomo-mit-lzo.exe"
          GOOS=windows GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 GOMAXPROCS=2 \
            go build -tags=with_gvisor -trimpath -buildvcs=false -ldflags "$ldflags" -o "$binary" .
          binary_sha="$(sha256sum "$binary" | awk '{print $1}')"
          binary_size="$(stat -c %s "$binary")"
          test "$binary_sha" = c00707e061c91fd5bfa5b3a88653597b00ae1ffad39ba33221e5c8cad1eefcbf
          printf 'Fresh candidate source: %s\nFresh Windows/amd64 SHA256: %s\nMeasured size: %s bytes\n' \
            "$source_sha" "$binary_sha" "$binary_size" >> "$GITHUB_STEP_SUMMARY"
          test -z "$(git -C "$core_source" status --porcelain)"
          python3 -B "$PR_SOURCE/candidates/cvr-2.5.10/verify-artifacts.py" \
            --artifacts "$RUNNER_TEMP/cvr-public-inputs" --core "$binary" | tee -a "$GITHUB_STEP_SUMMARY"


  assemble-draft-rc:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'smart-tinker/stcvrc' &&
      github.ref == 'refs/heads/codex/cvr-2.5.9-release-cycle-20261102'
    needs:
      - source
      - cvr-2-5-10-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOAMD64: v1
    steps:
      - name: Fetch exact RC manifest source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr_source="$RUNNER_TEMP/rc-pr-source"
          git init --quiet "$pr_source"
          git -C "$pr_source" remote add origin https://github.com/smart-tinker/stcvrc.git
          git -C "$pr_source" fetch --quiet --depth=1 --no-tags origin "$SOURCE_SHA"
          git -C "$pr_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$pr_source" rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "$pr_source/candidates/cvr-2.5.10/inputs.json"
          echo "PR_SOURCE=$pr_source" >> "$GITHUB_ENV"

      - name: Build the pinned MIT-LZO core from exact source
        run: |
          set -euo pipefail
          source_sha=76b7ec3ff9854d32cb3964403c065928ecdc9dd6
          upstream_sha=3f27ef39f8c96bbfbc8b0b9bb10f5c9ef60149d8
          core_source="$RUNNER_TEMP/rc-core-source"
          go_dir="$RUNNER_TEMP/rc-go1.26.10"
          mkdir -p "$core_source" "$go_dir"
          git -C "$core_source" init --quiet
          git -C "$core_source" remote add origin https://github.com/smart-tinker/stcvrc.git
          git -C "$core_source" fetch --quiet --depth=1 --no-tags origin "$source_sha"
          git -C "$core_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$core_source" rev-parse HEAD)" = "$source_sha"
          git -C "$core_source" fetch --quiet --depth=1 --no-tags https://github.com/MetaCubeX/mihomo.git refs/tags/v1.19.33
          test "$(git -C "$core_source" rev-parse 'FETCH_HEAD^{commit}')" = "$upstream_sha"

          curl --fail --location --proto '=https' --retry 2 --max-time 180 --silent --show-error \
            https://go.dev/dl/go1.26.10.linux-amd64.tar.gz -o "$go_dir/go.tar.gz"
          printf '%s  %s\n' ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5 "$go_dir/go.tar.gz" | sha256sum --check --status
          tar -xzf "$go_dir/go.tar.gz" -C "$go_dir"
          export PATH="$go_dir/go/bin:$PATH"
          export GOENV=off GOTOOLCHAIN=local GOWORK=off GOTELEMETRY=off
          export CGO_ENABLED=0 GOAMD64=v1 GOMAXPROCS=2
          export GOPATH="$RUNNER_TEMP/rc-gopath" GOMODCACHE="$RUNNER_TEMP/rc-modcache" GOCACHE="$RUNNER_TEMP/rc-gocache"
          export GOFLAGS='-mod=readonly -p=2'
          mkdir -p "$GOPATH" "$GOMODCACHE" "$GOCACHE"
          test "$(go version | awk '{print $3}')" = go1.26.10
          cd "$core_source"
          go list -m all > "$RUNNER_TEMP/rc-modules.txt"
          grep -Fxq 'github.com/anchore/go-lzo v0.1.1' "$RUNNER_TEMP/rc-modules.txt"
          if grep -q '^github.com/rasky/go-lzo ' "$RUNNER_TEMP/rc-modules.txt"; then
            printf 'GPL-only go-lzo module remains in RC source.\n' >&2
            exit 1
          fi
          go test -tags=with_gvisor -count=1 -timeout=180s ./transport/openvpn ./adapter/outbound ./adapter/outboundgroup
          go mod verify

          version=1.19.33-STCVRC-candidate-mit-lzo-20261109
          build_time=2026-11-09T00:00:00Z
          ldflags="-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$build_time"
          binary="$RUNNER_TEMP/verge-mihomo.exe"
          GOOS=windows GOARCH=amd64 GOAMD64=v1 CGO_ENABLED=0 GOMAXPROCS=2 \
            go build -tags=with_gvisor -trimpath -buildvcs=false -ldflags "$ldflags" -o "$binary" .
          binary_sha="$(sha256sum "$binary" | awk '{print $1}')"
          binary_size="$(stat -c %s "$binary")"
          test "$binary_sha" = c00707e061c91fd5bfa5b3a88653597b00ae1ffad39ba33221e5c8cad1eefcbf
          test "$binary_size" = 61143552
          test -z "$(git -C "$core_source" status --porcelain)"
          printf 'RC_BINARY=%s\nRC_BINARY_SHA=%s\nRC_BINARY_SIZE=%s\n' \
            "$binary" "$binary_sha" "$binary_size" >> "$GITHUB_ENV"

      - name: Create and read back the draft RC release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=stcvrc-1.19.33-rc.3
          repo=smart-tinker/stcvrc
          release_id="$(gh api "repos/$repo/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          if [[ -z "$release_id" ]]; then
            gh release create "$tag" "$RC_BINARY" "$manifest" --repo "$repo" --draft --prerelease \
              --target "$HEAD_SHA" --title "STCVRC 1.19.33 RC3 — CVR 2.5.10 candidate" --notes-file "$notes"
            release_id="$(gh api "repos/$repo/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")"
          fi
          [[ "$release_id" =~ ^[0-9]+$ ]]
          api="repos/$repo/releases/$release_id"
          test "$(gh api "$api" --jq .draft)" = true
          test "$(gh api "$api" --jq .prerelease)" = true
          test "$(gh api "$api" --jq .tag_name)" = "$tag"
          test "$(gh api "$api" --jq .name)" = "STCVRC 1.19.33 RC3 — CVR 2.5.10 candidate"
          release_target="$(gh api "$api" --jq .target_commitish)"
          assets_api="$api/assets"
          asset_names="$(gh api "$assets_api" --paginate --jq '.[].name' | LC_ALL=C sort)"
          test "$asset_names" = "$(printf 'RC-MANIFEST.json\nverge-mihomo.exe')"

          readback="$RUNNER_TEMP/rc-readback"
          mkdir "$readback"
          for asset_name in RC-MANIFEST.json verge-mihomo.exe; do
            asset_id="$(gh api "$assets_api" --paginate --jq ".[] | select(.name == \"$asset_name\") | .id")"
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 \
              --max-time 300 --max-filesize 67108864 --silent --show-error \
              -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/assets/$asset_id" -o "$readback/$asset_name"
          done
          cmp --silent "$RC_BINARY" "$readback/verge-mihomo.exe"
          test "$(sha256sum "$readback/verge-mihomo.exe" | awk '{print $1}')" = "$RC_BINARY_SHA"
          test "$(stat -c %s "$readback/verge-mihomo.exe")" = "$RC_BINARY_SIZE"
          creator_run_id="$(python3 - "$PR_SOURCE/candidates/cvr-2.5.10/inputs.json" "$readback/RC-MANIFEST.json" "$RC_BINARY_SHA" "$RC_BINARY_SIZE" "$tag" "$release_target" <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import sys

          inputs_path, manifest_path = map(Path, sys.argv[1:3])
          expected_sha, expected_size, tag, release_target = sys.argv[3], int(sys.argv[4]), sys.argv[5], sys.argv[6]
          input_bytes = inputs_path.read_bytes()
          inputs = json.loads(input_bytes)
          releases = {item["version"]: item for item in inputs["releases"]}
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_core = dict(inputs["core"], sha256=expected_sha, size=expected_size)
          expected_acceptance = {
              "installerExecuted": False,
              "extractedPayloads": "NOT_VERIFIED",
              "authenticode": "NOT_VERIFIED",
              "nativeWindowsAcceptance": "NOT_RUN",
              "productionDeployment": "NOT_AUTHORIZED",
          }
          if set(releases) != {"2.5.8", "2.5.10"}:
              raise SystemExit("Unexpected CVR release pair")
          if manifest.get("schemaVersion") != 1 or manifest.get("releaseTag") != tag:
              raise SystemExit("RC manifest schema/tag mismatch")
          if manifest.get("releaseState") != "DRAFT_NOT_PUBLISHED":
              raise SystemExit("RC manifest does not describe a draft")
          if manifest.get("inputManifestSha256") != hashlib.sha256(input_bytes).hexdigest():
              raise SystemExit("RC input manifest digest mismatch")
          if manifest.get("recovery") != releases["2.5.8"] or manifest.get("update") != releases["2.5.10"]:
              raise SystemExit("RC CVR pins mismatch")
          if manifest.get("core") != expected_core or manifest.get("acceptance") != expected_acceptance:
              raise SystemExit("RC core or acceptance evidence mismatch")
          workflow_sha = manifest.get("workflowHeadSha")
          creator_run = manifest.get("createdByWorkflowRun")
          if not isinstance(workflow_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", workflow_sha):
              raise SystemExit("Invalid RC workflow commit")
          if workflow_sha != release_target:
              raise SystemExit("Release target does not match the workflow commit recorded in the manifest")
          if type(creator_run) is not int or creator_run < 1:
              raise SystemExit("Invalid RC creator workflow run")
          print(creator_run)
          PY
          )"
          release_url="$(gh api "$api" --jq .html_url)"
          {
            printf '%s\n' "Draft release: $release_url"
            printf 'Release remains draft/unpublished; assets are core and manifest only.\n'
            printf 'Fresh core SHA256: %s\nSize: %s bytes\n' "$RC_BINARY_SHA" "$RC_BINARY_SIZE"
            printf 'Core bytes matched after download; manifest pins CVR 2.5.8 recovery and 2.5.10 update.\n'
            printf 'Manifest creator run: %s; current verifier run: %s\n' "$creator_run_id" "$RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
